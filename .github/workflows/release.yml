name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release (ex. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64,  os: ubuntu-latest,  wg: linux_amd64,   shell: bash }
          - { name: linux-arm64,  os: ubuntu-latest,  wg: linux_arm64,   shell: bash, cross: aarch64 }
          - { name: linux-arm,    os: ubuntu-latest,  wg: linux_arm,     shell: bash, cross: arm }
          - { name: windows-amd64, os: windows-latest, wg: windows_amd64, shell: pwsh }
          - { name: macos-all,    os: macos-latest,   wg: darwin_all,    shell: bash }
          # Termux/Android : archive dédiée avec script d'installation
          - { name: termux-aarch64, os: ubuntu-latest, wg: linux_arm64,  shell: bash, termux: true }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installation des dépendances (prod)
        run: npm install --omit=dev --no-audit --no-fund

      - name: Tests rapides avant packaging
        run: npm test

      - name: Télécharge wireproxy (${{ matrix.wg }})
        shell: bash
        run: |
          mkdir -p bundle/bin
          curl -fsSL -o /tmp/wg.tar.gz \
            "https://github.com/pufferffish/wireproxy/releases/download/v1.1.3/wireproxy_${{ matrix.wg }}.tar.gz"
          tar -xzf /tmp/wg.tar.gz -C bundle/bin
          rm -f /tmp/wg.tar.gz

      - name: Assemble the bundle
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "${{ matrix.termux }}" ] && VERSION="${VERSION}-termux"
          NAME="ghostwire-${{ matrix.name }}-${VERSION}"
          mkdir -p "dist/${NAME}"
          cp -r bin src scripts package.json README.md LICENSE .env.example docs "dist/${NAME}/" 2>/dev/null || \
            cp -r bin src scripts package.json README.md LICENSE .env.example "dist/${NAME}/"
          cp -r bundle/bin/* "dist/${NAME}/bin/"
          chmod +x "dist/${NAME}/bin/wireproxy" 2>/dev/null || true
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          echo "NAME=${NAME}" >> "$GITHUB_ENV"

      - name: Build Windows tray app (self-contained)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish desktop-windows/GhostWireTray -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o dist/trayapp
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          Compress-Archive -Path "dist/trayapp/GhostWireTray.exe" `
            -DestinationPath "dist/ghostwire-windows-tray-$ver.zip" -Force

      - name: Build Android APK
        if: matrix.name == 'linux-amd64'
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          bash scripts/build-android.sh
          cp android/GhostWire.apk dist/

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.apk
          if-no-files-found: error

  publish:
    name: Publication GitHub Release
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          for f in *.tar.gz *.zip *.apk; do
            [ -f "$f" ] || continue
            sha256sum "$f"
          done > checksums.txt
          cat checksums.txt

      - name: Crée la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: GhostWire ${{ inputs.tag || github.ref_name }}
          body: |
            ## GhostWire ${{ inputs.tag || github.ref_name }}

            ### Quick start
            - **Linux / macOS / Termux (Android)**: see the commands in the README, or `bash install.sh`
            - **Windows**: unzip a bundle, run `install.ps1` — or grab `ghostwire-windows-tray-*.zip` for the tray app
            - **Android app**: install `GhostWire.apk`, enter your panel address, sign in
            - **Docker**: `docker run -p 8080:8080 ghcr.io/${{ github.repository }}:latest`

            ### What's inside
            Every `*.tar.gz` bundle ships the panel + the matching `wireproxy` binary.
            The APK and the tray app talk to any running panel over HTTP.
            Verify downloads with `checksums.txt` (SHA-256).
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.apk
            dist/checksums.txt
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}

  docker:
    name: Image Docker (GHCR)
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
