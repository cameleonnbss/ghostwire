name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests · ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
        exclude:
          # Réduire la matrice : Windows/macOS sur une seule version LTS
          - os: windows-latest
            node: 20
          - os: macos-latest
            node: 20
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Installation des dépendances
        run: npm install --no-audit --no-fund

      - name: Vérification syntaxe
        run: npm run check

      - name: Tests
        run: npm test

  smoke:
    name: Smoke test serveur (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Démarre le panneau et vérifie /api/ping
        run: |
          node bin/ghostwire.js start --port 8123 --demo &
          sleep 3
          curl -fsS http://127.0.0.1:8123/api/ping
          curl -fsS http://127.0.0.1:8123/ | grep -q GhostWire
          kill %1
